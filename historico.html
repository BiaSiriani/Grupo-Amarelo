<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MáquinaStop — Histórico / Planilha</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F4F2EE;
      --surface: #FFFFFF;
      --border: #E2DFD8;
      --text: #18170F;
      --muted: #7A7870;
      --accent: #1A1916;
      --red: #C93B3A;
      --red-bg: #FDF0F0;
      --red-border: #f0caca;
      --amber: #BA7517;
      --amber-bg: #FAEEDA;
      --amber-border: #FAC775;
      --green: #3B6D11;
      --green-bg: #EAF3DE;
      --green-border: #c0dd97;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
    }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      gap: 10px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .back-btn:hover { color: var(--text); }

    .topbar-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .topbar-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    .btn-export {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .btn-export:hover { opacity: 0.85; }

    .btn-clear {
      padding: 8px 12px;
      background: var(--surface);
      color: var(--red);
      border: 1px solid var(--red-border);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      display: none;
    }

    @media (min-width: 500px) {
      .btn-clear { display: block; }
      .btn-export { font-size: 13px; padding: 8px 16px; }
      .topbar { padding: 14px 24px; }
      .topbar-title { font-size: 15px; }
    }

    .btn-clear:hover { background: var(--red-bg); }

    .main { padding: 16px 12px 60px; max-width: 1400px; margin: 0 auto; }

    @media (min-width: 480px) {
      .main { padding: 20px 20px 60px; }
    }

    /* STATS */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    @media (min-width: 480px) {
      .stats-row { grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
    }

    @media (min-width: 480px) {
      .stat-card { padding: 14px 16px; }
    }

    .stat-val {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -1px;
      line-height: 1;
      margin-bottom: 3px;
    }

    @media (min-width: 480px) {
      .stat-val { font-size: 24px; }
    }

    .stat-label {
      font-size: 9px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    @media (min-width: 480px) {
      .stat-label { font-size: 10px; }
    }

    /* FILTROS */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-bar input, .filter-bar select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--surface);
      outline: none;
      transition: border-color 0.15s;
      appearance: none;
    }

    .filter-bar input:focus, .filter-bar select:focus { border-color: #aaa; }
    .filter-bar input[type="text"] { width: 100%; }

    @media (min-width: 560px) {
      .filter-bar input[type="text"] { width: auto; min-width: 220px; }
    }

    .filter-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .incomplete-warn {
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: #854F0B;
      margin-bottom: 14px;
    }

    /* TABLE */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      min-width: 900px;
    }

    thead tr {
      background: #F0EEE8;
      border-bottom: 2px solid var(--border);
    }

    th {
      padding: 10px 12px;
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: color 0.12s;
    }

    th:hover { color: var(--text); }
    th.sorted { color: var(--accent); }
    th .sort-arrow { margin-left: 4px; font-size: 9px; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafaf7; }

    td {
      padding: 10px 12px;
      vertical-align: top;
    }

    td.truncate {
      max-width: 160px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 500;
      white-space: nowrap;
    }

    .badge-red    { background: var(--red-bg);   color: #A32D2D; border: 1px solid var(--red-border); }
    .badge-amber  { background: var(--amber-bg);  color: #854F0B; border: 1px solid var(--amber-border); }
    .badge-green  { background: var(--green-bg);  color: var(--green); border: 1px solid var(--green-border); }
    .badge-blue   { background: #E6F1FB; color: #185FA5; border: 1px solid #b5d4f4; }

    .manut-cell { color: var(--muted); font-size: 11px; }
    .manut-cell.filled { color: var(--text); font-weight: 500; }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-icon { font-size: 36px; margin-bottom: 10px; }
    .empty-title { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
    .empty-sub { font-size: 13px; }

    .row-num {
      font-size: 10px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .dur-cell {
      font-variant-numeric: tabular-nums;
      font-size: 11px;
    }

    .table-footer {
      padding: 10px 16px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <a class="back-btn" href="home.html">← Voltar</a>
    <span class="topbar-title">Histórico de Paradas</span>
  </div>
  <div class="topbar-actions">
    <button class="btn-clear" onclick="confirmarLimpar()">🗑 Limpar</button>
    <button class="btn-export" onclick="exportarExcel()">⬇ .xlsx</button>
  </div>
</div>

<div class="main">

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-val" id="s-total">0</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:var(--green)" id="s-completo">0</div>
      <div class="stat-label">Completos</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:var(--red)" id="s-incompleto">0</div>
      <div class="stat-label">Incompl.</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:var(--amber)" id="s-hoje">0</div>
      <div class="stat-label">Hoje</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:var(--accent)" id="s-dur">—</div>
      <div class="stat-label">Dur. média</div>
    </div>
  </div>

  <!-- AVISO INCOMPLETOS -->
  <div class="incomplete-warn" id="warn-incompleto" style="display:none">
    ⚠ Há registros sem manutenção preenchida. <a href="relatorios.html" style="color:inherit;font-weight:600;text-decoration:underline">Preencher agora →</a>
  </div>

  <!-- FILTROS -->
  <div class="filter-bar">
    <input type="text" id="f-busca" placeholder="Equipamento, operador, linha..." oninput="renderTabela()"/>
    <input type="date" id="f-data-ini" oninput="renderTabela()"/>
    <input type="date" id="f-data-fim" oninput="renderTabela()"/>
    <select id="f-status" onchange="renderTabela()">
      <option value="">Todos status</option>
      <option value="completo">Completos</option>
      <option value="incompleto">Incompletos</option>
    </select>
    <select id="f-cod" onchange="renderTabela()">
      <option value="">Todos códigos</option>
    </select>
  </div>

  <!-- TABELA -->
  <div class="table-wrap">
    <div class="table-scroll">
      <table id="tabela">
        <thead>
          <tr>
            <th onclick="sortBy('row')">#<span class="sort-arrow">↕</span></th>
            <th onclick="sortBy('dataInicial')">Data<span class="sort-arrow">↕</span></th>
            <th onclick="sortBy('linha')">Linha<span class="sort-arrow">↕</span></th>
            <th onclick="sortBy('codEquipamento')">Cód.<span class="sort-arrow">↕</span></th>
            <th onclick="sortBy('equipamento')">Equipamento<span class="sort-arrow">↕</span></th>
            <th onclick="sortBy('codMotivo')">Cód. Parada<span class="sort-arrow">↕</span></th>
            <th onclick="sortBy('inicioOcorrencia')">Início<span class="sort-arrow">↕</span></th>
            <th onclick="sortBy('fimOcorrencia')">Fim<span class="sort-arrow">↕</span></th>
            <th onclick="sortBy('duracao')">Min<span class="sort-arrow">↕</span></th>
            <th onclick="sortBy('operador')">Operador<span class="sort-arrow">↕</span></th>
            <th>Manut. 1</th>
            <th>Tarefa</th>
            <th>Área</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="table-footer">
      <span id="footer-count">—</span>
      <span id="footer-dur">—</span>
    </div>
  </div>

</div>

<script>
  const user = JSON.parse(localStorage.getItem('ms_user') || 'null');
  if (!user) window.location.href = 'index.html';

  const codigos = {
    '1':'Quebra','2':'Set-up','3':'Troca fer.','4':'Produção',
    '5':'Pequenas paradas','6':'Velocidade','7':'Defeito',
    '8':'Programada','9':'Gestão','10':'Mov. operacionais',
    '11':'Organização','12':'Logística','13':'Medições e ajuste'
  };

  const fCod = document.getElementById('f-cod');
  Object.entries(codigos).forEach(([num, nome]) => {
    const opt = document.createElement('option');
    opt.value = num;
    opt.textContent = `${num} — ${nome}`;
    fCod.appendChild(opt);
  });

  let sortField = 'dataInicial';
  let sortAsc = false;

  function sortBy(field) {
    if (sortField === field) sortAsc = !sortAsc;
    else { sortField = field; sortAsc = false; }
    renderTabela();
  }

  function calcDurMin(inicio, fim) {
    if (!inicio || !fim) return null;
    const [h1, m1] = inicio.split(':').map(Number);
    const [h2, m2] = fim.split(':').map(Number);
    let mins = (h2 * 60 + m2) - (h1 * 60 + m1);
    if (mins < 0) mins += 24 * 60;
    return mins;
  }

  function formatDate(iso) {
    if (!iso) return '—';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  function getCodBadge(cod) {
    if (['1','2'].includes(cod)) return 'badge-red';
    if (['3','5','7'].includes(cod)) return 'badge-amber';
    return 'badge-blue';
  }

  function renderTabela() {
    const rels = JSON.parse(localStorage.getItem('ms_relatorios') || '[]');
    const hoje = new Date().toISOString().slice(0, 10);
    const busca = document.getElementById('f-busca').value.toLowerCase();
    const dataIni = document.getElementById('f-data-ini').value;
    const dataFim = document.getElementById('f-data-fim').value;
    const status = document.getElementById('f-status').value;
    const codFiltro = document.getElementById('f-cod').value;

    const completos = rels.filter(r => r.manutencao);
    const incompletos = rels.filter(r => !r.manutencao);
    document.getElementById('s-total').textContent = rels.length;
    document.getElementById('s-completo').textContent = completos.length;
    document.getElementById('s-incompleto').textContent = incompletos.length;
    document.getElementById('s-hoje').textContent = rels.filter(r => r.dataISO === hoje).length;

    const durs = rels.map(r => r.duracao !== null && r.duracao !== undefined ? r.duracao : calcDurMin(r.inicioOcorrencia, r.fimOcorrencia)).filter(d => d !== null);
    const avgDur = durs.length > 0 ? Math.round(durs.reduce((a,b) => a+b, 0) / durs.length) : null;
    document.getElementById('s-dur').textContent = avgDur !== null ? avgDur : '—';

    document.getElementById('warn-incompleto').style.display = incompletos.length > 0 ? 'block' : 'none';

    let lista = [...rels].map((r, i) => ({ ...r, _origIdx: i + 1 }));

    if (busca) lista = lista.filter(r =>
      (r.equipamento||'').toLowerCase().includes(busca) ||
      (r.operador||'').toLowerCase().includes(busca) ||
      (r.linha||'').toLowerCase().includes(busca) ||
      (r.codEquipamento||'').toLowerCase().includes(busca)
    );

    if (dataIni) lista = lista.filter(r => r.dataInicial >= dataIni);
    if (dataFim) lista = lista.filter(r => r.dataInicial <= dataFim);
    if (status === 'completo') lista = lista.filter(r => r.manutencao);
    if (status === 'incompleto') lista = lista.filter(r => !r.manutencao);
    if (codFiltro) lista = lista.filter(r => r.codMotivo === codFiltro);

    lista.sort((a, b) => {
      let va = a[sortField] || '', vb = b[sortField] || '';
      if (sortField === 'row') { va = a._origIdx; vb = b._origIdx; }
      if (typeof va === 'string') return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
      return sortAsc ? va - vb : vb - va;
    });

    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';

    if (lista.length === 0) {
      tbody.innerHTML = `<tr><td colspan="14">
        <div class="empty-state">
          <div class="empty-icon">📋</div>
          <div class="empty-title">Nenhum registro encontrado</div>
          <div class="empty-sub">Tente ajustar os filtros.</div>
        </div>
      </td></tr>`;
      document.getElementById('footer-count').textContent = '0 registros';
      document.getElementById('footer-dur').textContent = '';
      return;
    }

    const filtDurs = lista.map(r => r.duracao !== null && r.duracao !== undefined ? r.duracao : calcDurMin(r.inicioOcorrencia, r.fimOcorrencia)).filter(d => d !== null);
    const filtTotal = filtDurs.reduce((a,b) => a+b, 0);
    const filtAvg = filtDurs.length > 0 ? Math.round(filtTotal / filtDurs.length) : null;

    document.getElementById('footer-count').textContent = `${lista.length} registro${lista.length !== 1 ? 's' : ''}`;
    document.getElementById('footer-dur').textContent = filtAvg !== null ? `Média: ${filtAvg} min` : '';

    lista.forEach((r) => {
      const dur = r.duracao !== null && r.duracao !== undefined ? r.duracao : calcDurMin(r.inicioOcorrencia, r.fimOcorrencia);
      const nomeMotivo = codigos[r.codMotivo] || `Cód. ${r.codMotivo}`;
      const m = r.manutencao;
      const isCompleto = !!m;
      const codBadge = getCodBadge(r.codMotivo);

      const tr = document.createElement('tr');
      if (!isCompleto) tr.style.background = '#fffcf8';

      tr.innerHTML = `
        <td class="row-num">${r._origIdx}</td>
        <td style="white-space:nowrap">${formatDate(r.dataInicial)}</td>
        <td>${r.linha || '—'}</td>
        <td style="font-size:11px;color:var(--muted)">${r.codEquipamento || '—'}</td>
        <td class="truncate" title="${r.equipamento || ''}">${r.equipamento || '—'}</td>
        <td><span class="badge ${codBadge}">${r.codMotivo} — ${nomeMotivo}</span></td>
        <td style="font-variant-numeric:tabular-nums;white-space:nowrap">${r.inicioOcorrencia || '—'}</td>
        <td style="font-variant-numeric:tabular-nums;white-space:nowrap">${r.fimOcorrencia || '—'}</td>
        <td class="dur-cell">${dur !== null ? dur : '—'}</td>
        <td style="white-space:nowrap">${r.operador || '—'}</td>
        <td class="manut-cell ${m?.manut1Nome ? 'filled' : ''}">${m?.manut1Nome || '—'}</td>
        <td style="font-size:11px">${m?.tarefa || '—'}</td>
        <td style="font-size:11px">${m?.area || '—'}</td>
        <td>
          ${isCompleto
            ? '<span class="badge badge-green">✓ OK</span>'
            : '<span class="badge badge-red">⚠ Aberto</span>'}
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function exportarExcel() {
    const rels = JSON.parse(localStorage.getItem('ms_relatorios') || '[]');
    if (rels.length === 0) { alert('Nenhum dado para exportar.'); return; }

    const headers = [
      'Data', 'Linha', 'CÓD.', 'Nome Equipamento', 'DESCRIÇÃO',
      'Inicio da ocorrência', 'Fim da ocorrência',
      'Manutentor 1', 'Manutentor 2', 'Manutentor 3',
      'NºRELATÓRIO', 'hora', 'D. OCORRENCI (horas)', 'D. OCORRENCI (min)',
      'OFICINA', 'Operador', 'Crachá', 'Turno', 'Lote',
      'Cód. Motivo Parada', 'Tarefa Manut.', 'Causa Manut.', 'Obs. Manutenção'
    ];

    const rows = rels.map((r, i) => {
      const m = r.manutencao;
      const durMin = r.duracao !== null && r.duracao !== undefined ? r.duracao : null;
      const durHrs = durMin !== null ? durMin / 60 : null;
      return [
        r.dataInicial||'', r.linha||'', r.codEquipamento||'', r.equipamento||'', r.descricao||'',
        r.inicioOcorrencia||'', r.fimOcorrencia||'',
        m?.manut1Nome||'', m?.manut2Nome||'', m?.manut3Nome||'',
        i + 1, r.inicioOcorrencia||'',
        durHrs !== null ? Math.round(durHrs * 100) / 100 : '',
        durMin !== null ? durMin : '',
        m?.area||'', r.operador||'', r.cracha||'', r.turno||'', r.lote||'',
        `${r.codMotivo} — ${codigos[r.codMotivo] || '?'}`,
        m?.tarefa||'', m?.causa||'', m?.observacoes||'',
      ];
    });

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
    XLSX.utils.book_append_sheet(wb, ws, 'Histórico Paradas');

    const hoje = new Date();
    const dd = String(hoje.getDate()).padStart(2,'0');
    const mm = String(hoje.getMonth()+1).padStart(2,'0');
    const yyyy = hoje.getFullYear();
    XLSX.writeFile(wb, `MaquinaStop_Histórico_${yyyy}${mm}${dd}.xlsx`);
  }

  function confirmarLimpar() {
    if (confirm('Tem certeza? Isso apagará TODOS os relatórios. Esta ação não pode ser desfeita.')) {
      localStorage.removeItem('ms_relatorios');
      renderTabela();
    }
  }

  renderTabela();
</script>
</body>
</html>
