<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MáquinaStop — Painel</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F4F2EE;
      --surface: #FFFFFF;
      --border: #E2DFD8;
      --text: #18170F;
      --muted: #7A7870;
      --accent: #1A1916;
      --red: #C93B3A;
      --red-bg: #FDF0F0;
      --red-border: #f0caca;
      --amber: #BA7517;
      --amber-bg: #FAEEDA;
      --amber-border: #FAC775;
      --green: #3B6D11;
      --green-bg: #EAF3DE;
      --green-border: #c0dd97;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
    }

    /* TOPBAR */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .top-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
    }

    .logo-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .top-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-info {
      text-align: right;
    }

    .user-name {
      font-size: 13px;
      font-weight: 500;
    }

    .user-turno {
      font-size: 11px;
      color: var(--muted);
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* MAIN */
    .main {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .page-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    /* BIG ACTION BUTTON */
    .action-btn {
      display: flex;
      align-items: center;
      gap: 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 20px 24px;
      width: 100%;
      cursor: pointer;
      text-align: left;
      margin-bottom: 24px;
      transition: opacity 0.15s, transform 0.12s;
      text-decoration: none;
    }

    .action-btn:hover { opacity: 0.88; }
    .action-btn:active { transform: scale(0.99); }

    .action-icon {
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .action-label {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .action-sub {
      font-size: 12px;
      opacity: 0.65;
      margin-top: 2px;
    }

    /* SECTION */
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    /* STATS ROW */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .stat-val {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -1px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* RECENT LIST */
    .recent-list {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .recent-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s;
    }

    .recent-item:last-child { border-bottom: none; }
    .recent-item:hover { background: var(--bg); }

    .ri-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .ri-info { flex: 1; }

    .ri-title {
      font-size: 13px;
      font-weight: 500;
    }

    .ri-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      flex-shrink: 0;
    }

    .badge-red    { background: var(--red-bg);   color: #A32D2D; border: 1px solid var(--red-border); }
    .badge-amber  { background: var(--amber-bg);  color: #854F0B; border: 1px solid var(--amber-border); }
    .badge-green  { background: var(--green-bg);  color: var(--green); border: 1px solid var(--green-border); }

    /* LOGOUT */
    .logout-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .logout-btn:hover { border-color: var(--red); color: var(--red); }

    .empty-state {
      text-align: center;
      padding: 32px 20px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .topbar { padding: 12px 16px; }
      .main { padding: 20px 14px 60px; }
      .user-info { display: none; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="top-logo">
      <div class="logo-icon">MS</div>
      <div class="logo-name">MáquinaStop</div>
    </div>
    <div class="top-user">
      <div class="user-info">
        <div class="user-name" id="user-name">—</div>
        <div class="user-turno" id="user-turno">—</div>
      </div>
      <div class="avatar" id="user-avatar" title="Perfil">?</div>
      <button class="logout-btn" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="main">
    <div class="page-title">Bom dia, <span id="first-name">Operador</span> 👋</div>
    <div class="page-sub" id="today-date">—</div>

    <!-- BOTÕES PRINCIPAIS -->
    <a class="action-btn" href="relatorio.html">
      <div class="action-icon">📋</div>
      <div>
        <div class="action-label">Registrar parada de máquina</div>
        <div class="action-sub">Preencher relatório de ocorrência</div>
      </div>
      <span style="margin-left:auto; font-size:20px; opacity:0.5;">›</span>
    </a>

    <a class="action-btn" href="relatorios.html" style="background:var(--surface);color:var(--text);border:1px solid var(--border);">
      <div class="action-icon" style="background:var(--bg);">🔧</div>
      <div>
        <div class="action-label">Ver relatórios abertos</div>
        <div class="action-sub">Chamados e campo manutentor</div>
      </div>
      <span style="margin-left:auto; font-size:20px; opacity:0.3;">›</span>
    </a>

    <!-- STATS -->
    <div class="section-title">Resumo — hoje</div>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-val" id="stat-total" style="color: var(--text)">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-alta" style="color: var(--red)">0</div>
        <div class="stat-label">Alta grav.</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-media" style="color: var(--amber)">0</div>
        <div class="stat-label">Média/Baixa</div>
      </div>
    </div>

    <!-- ÚLTIMOS REGISTROS -->
    <div class="section-title">Últimos registros</div>
    <div class="recent-list" id="recent-list">
      <div class="empty-state" id="empty-msg">Nenhuma parada registrada ainda.<br>Use o botão acima para registrar.</div>
    </div>
  </div>

  <script>
    // Guard: se não está logado, volta pro login
    const user = JSON.parse(localStorage.getItem('ms_user') || 'null');
    if (!user) window.location.href = 'index.html';

    // Preenche info do usuário
    document.getElementById('user-name').textContent = user.nome;
    document.getElementById('user-turno').textContent = user.turno;
    document.getElementById('first-name').textContent = user.nome.split(' ')[0];
    document.getElementById('user-avatar').textContent = user.nome.charAt(0).toUpperCase();

    // Saudação por horário
    const h = new Date().getHours();
    const greeting = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
    document.querySelector('.page-title').innerHTML = `${greeting}, <span id="first-name">${user.nome.split(' ')[0]}</span> 👋`;

    // Data
    const now = new Date();
    document.getElementById('today-date').textContent = now.toLocaleDateString('pt-BR', {
      weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'
    });

    // Carrega relatórios
    const relatorios = JSON.parse(localStorage.getItem('ms_relatorios') || '[]');
    const hoje = now.toISOString().slice(0, 10);
    const deHoje = relatorios.filter(r => r.dataISO === hoje);

    document.getElementById('stat-total').textContent = relatorios.length;
    document.getElementById('stat-alta').textContent  = relatorios.filter(r => r.codMotivo && ['1','2'].includes(r.codMotivo)).length;
    document.getElementById('stat-media').textContent  = relatorios.filter(r => r.codMotivo && !['1','2'].includes(r.codMotivo)).length;

    const list = document.getElementById('recent-list');
    const empty = document.getElementById('empty-msg');

    if (relatorios.length > 0) {
      empty.style.display = 'none';
      const sorted = [...relatorios].reverse().slice(0, 8);
      sorted.forEach(r => {
        const item = document.createElement('div');
        item.className = 'recent-item';

        const codigos = {
          '1':'Quebra','2':'Set-up','3':'Troca fer.','4':'Produção',
          '5':'Pequenas paradas','6':'Velocidade','7':'Defeito',
          '8':'Programada','9':'Gestão','10':'Mov. operacionais',
          '11':'Organização','12':'Logística','13':'Medições e ajuste'
        };
        const nomeMotivo = codigos[r.codMotivo] || `Cód. ${r.codMotivo}`;
        const grave = ['1','2'].includes(r.codMotivo) ? 'alta' : r.codMotivo === '3' ? 'amber' : 'green';

        item.innerHTML = `
          <div class="ri-dot" style="background: ${grave === 'alta' ? 'var(--red)' : grave === 'amber' ? 'var(--amber)' : 'var(--green)'}"></div>
          <div class="ri-info">
            <div class="ri-title">${r.equipamento || '—'}</div>
            <div class="ri-meta">${r.dataInicial || '—'} · Cód. ${r.codMotivo} — ${nomeMotivo} · ${r.operador || '—'}</div>
          </div>
          <span class="badge badge-${grave === 'alta' ? 'red' : grave === 'amber' ? 'amber' : 'green'}">${grave === 'alta' ? 'Alta' : grave === 'amber' ? 'Média' : 'Baixa'}</span>
        `;
        list.appendChild(item);
      });
    }

    function logout() {
      localStorage.removeItem('ms_user');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
