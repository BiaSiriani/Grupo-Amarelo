<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PararNão — Painel</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #FFF8F2; --surface: #FFFFFF; --border: #F2D5BE;
      --text: #2A1A0E; --muted: #A0816A; --accent: #E8620A;
      --red: #C93B3A; --red-bg: #FDF0F0; --red-border: #f0caca;
      --amber: #BA7517; --amber-bg: #FAEEDA; --amber-border: #FAC775;
      --green: #3B6D11; --green-bg: #EAF3DE; --green-border: #c0dd97;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); min-height: 100vh; color: var(--text); }

    .topbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 12px 16px; display: flex; align-items: center;
      justify-content: space-between; position: sticky; top: 0; z-index: 50;
    }
    .top-logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 12px; flex-shrink: 0; }
    .logo-name { font-size: 14px; font-weight: 600; letter-spacing: -0.3px; }

    .top-user { display: flex; align-items: center; gap: 8px; }
    .user-info { text-align: right; }
    .user-name { font-size: 12px; font-weight: 500; }
    .user-turno { font-size: 10px; color: var(--muted); }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
    .logout-btn { padding: 6px 12px; background: none; border: 1px solid var(--border); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--muted); cursor: pointer; transition: border-color 0.15s, color 0.15s; white-space: nowrap; }
    .logout-btn:hover { border-color: var(--red); color: var(--red); }

    .main { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }
    .page-title { font-size: 20px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 4px; }
    .page-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }

    .action-btn {
      display: flex; align-items: center; gap: 14px;
      background: var(--accent); color: #fff; border: none;
      border-radius: 14px; padding: 18px 20px; width: 100%;
      cursor: pointer; text-align: left; margin-bottom: 10px;
      transition: opacity 0.15s, transform 0.12s; text-decoration: none;
    }
    .action-btn:hover { opacity: 0.88; }
    .action-btn:active { transform: scale(0.99); }
    .action-icon { width: 44px; height: 44px; background: rgba(255,255,255,0.15); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .action-label { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
    .action-sub { font-size: 12px; opacity: 0.65; margin-top: 2px; }
    .action-arrow { margin-left: auto; font-size: 20px; opacity: 0.5; flex-shrink: 0; }

    @media (max-width: 380px) {
      .user-info { display: none; }
      .action-label { font-size: 14px; }
    }
  
    /* ── MARILAN THEME OVERRIDES ── */
    .topbar { background: linear-gradient(135deg, #fff 0%, #FFF5EE 100%); border-bottom: 2px solid #F2C99A; }
    .logo-icon, .avatar { background: linear-gradient(135deg, #E8620A 0%, #C44E05 100%) !important; }
    .action-btn[href="relatorio.html"] { background: linear-gradient(135deg, #E8620A 0%, #C44E05 100%) !important; }
    .btn { background: linear-gradient(135deg, #E8620A 0%, #C44E05 100%) !important; }
    .btn-manut:not(.done) { background: linear-gradient(135deg, #E8620A 0%, #C44E05 100%) !important; }
    .tab-btn.active { background: var(--surface); color: #E8620A !important; box-shadow: 0 1px 4px rgba(232,98,10,0.15); }
    .filter-btn.active { background: #E8620A !important; border-color: #E8620A !important; }
    .logout-btn:hover { border-color: #E8620A !important; color: #E8620A !important; }

  </style>
</head>
<body>
  <div class="topbar">
    <div class="top-logo">
      <div class="logo-icon">PN</div>
      <div class="logo-name" style="font-family:Nunito,sans-serif;color:#E8620A;">PararNão</div>
    </div>
    <div class="top-user">
      <div class="user-info">
        <div class="user-name" id="user-name">—</div>
        <div class="user-turno" id="user-turno">—</div>
      </div>
      <div class="avatar" id="user-avatar" title="Perfil">?</div>
      <button class="logout-btn" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="main">
    <div class="page-title" id="greeting">Olá 👋</div>
    <div class="page-sub" id="today-date">—</div>

    <a class="action-btn" href="relatorio.html">
      <div class="action-icon">📋</div>
      <div>
        <div class="action-label">Registrar parada de máquina</div>
        <div class="action-sub">Preencher relatório de ocorrência</div>
      </div>
      <span class="action-arrow">›</span>
    </a>

    <a class="action-btn" href="relatorios.html" style="background:var(--surface);color:var(--text);border:1px solid #F2C99A;">
      <div class="action-icon" style="background:#FFF0E5;">🔧</div>
      <div>
        <div class="action-label">Ver relatórios abertos</div>
        <div class="action-sub">Chamados e campo manutentor</div>
      </div>
      <span class="action-arrow" style="opacity:0.3;">›</span>
    </a>

    <a class="action-btn" href="dashboard.html" style="background:var(--surface);color:var(--text);border:1px solid #F2C99A;">
      <div class="action-icon" style="background:#FFF0E5;">📊</div>
      <div>
        <div class="action-label">Dashboard de paradas</div>
        <div class="action-sub">Análise geral dos relatórios finalizados</div>
      </div>
      <span class="action-arrow" style="opacity:0.3;">›</span>
    </a>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('ms_user') || 'null');
    if (!user) window.location.href = 'index.html';
    document.getElementById('user-name').textContent = user.nome;
    document.getElementById('user-turno').textContent = user.turno;
    document.getElementById('user-avatar').textContent = user.nome.charAt(0).toUpperCase();
    const h = new Date().getHours();
    const greeting = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
    document.getElementById('greeting').innerHTML = `${greeting}, ${user.nome.split(' ')[0]} 👋`;
    const now = new Date();
    document.getElementById('today-date').textContent = now.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
    function logout() { localStorage.removeItem('ms_user'); window.location.href = 'index.html'; }
  </script>
</body>
</html>
