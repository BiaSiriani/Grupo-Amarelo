<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MáquinaStop — Relatórios Abertos</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F4F2EE;
      --surface: #FFFFFF;
      --border: #E2DFD8;
      --text: #18170F;
      --muted: #7A7870;
      --accent: #1A1916;
      --red: #C93B3A;
      --red-bg: #FDF0F0;
      --red-border: #f0caca;
      --amber: #BA7517;
      --amber-bg: #FAEEDA;
      --amber-border: #FAC775;
      --green: #3B6D11;
      --green-bg: #EAF3DE;
      --green-border: #c0dd97;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
    }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .back-btn {
      display: flex; align-items: center; gap: 6px;
      background: none; border: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-size: 13px;
      color: var(--muted); text-decoration: none;
      transition: color 0.15s; white-space: nowrap; flex-shrink: 0;
    }
    .back-btn:hover { color: var(--text); }

    .topbar-title {
      font-size: 14px; font-weight: 600; letter-spacing: -0.3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .main { max-width: 720px; margin: 0 auto; padding: 16px 12px 60px; }

    @media (min-width: 480px) {
      .main { padding: 24px 20px 60px; }
      .topbar { padding: 14px 24px; }
      .topbar-title { font-size: 15px; }
    }

    .filter-row {
      display: flex; gap: 8px;
      margin-bottom: 16px; flex-wrap: wrap;
    }

    .filter-btn {
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px; font-weight: 500;
      color: var(--muted); cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .search-input {
      flex: 1; min-width: 140px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; color: var(--text);
      background: var(--surface); outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus { border-color: #aaa; }

    /* STATS — 2 colunas no mobile, 4 no desktop */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }

    @media (min-width: 480px) {
      .stats-row { grid-template-columns: repeat(4, 1fr); gap: 10px; }
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px; text-align: center;
    }

    .stat-val {
      font-size: 22px; font-weight: 600;
      letter-spacing: -1px; line-height: 1; margin-bottom: 3px;
    }

    @media (min-width: 480px) {
      .stat-val { font-size: 24px; }
    }

    .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* CARD */
    .rel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 10px;
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .rel-card-header {
      display: flex;
      align-items: stretch;
    }

    .status-bar {
      width: 4px;
      flex-shrink: 0;
    }

    .rel-header-content {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 12px;
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    @media (min-width: 480px) {
      .rel-header-content { padding: 14px 16px; gap: 12px; }
    }

    .rel-main { flex: 1; min-width: 0; }

    .rel-top {
      display: flex; align-items: center;
      gap: 6px; margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .rel-equip { font-size: 13px; font-weight: 600; letter-spacing: -0.2px; }

    @media (min-width: 400px) {
      .rel-equip { font-size: 14px; }
    }

    .badge {
      display: inline-flex; align-items: center;
      padding: 2px 7px; border-radius: 20px;
      font-size: 10px; font-weight: 500;
      white-space: nowrap;
    }

    .badge-red    { background: var(--red-bg);   color: #A32D2D; border: 1px solid var(--red-border); }
    .badge-amber  { background: var(--amber-bg);  color: #854F0B; border: 1px solid var(--amber-border); }
    .badge-green  { background: var(--green-bg);  color: var(--green); border: 1px solid var(--green-border); }
    .badge-blue   { background: #E6F1FB; color: #185FA5; border: 1px solid #b5d4f4; }

    .rel-meta { font-size: 11px; color: var(--muted); }

    @media (min-width: 400px) {
      .rel-meta { font-size: 12px; }
    }

    .btn-manut-wrap {
      padding: 12px 12px 12px 0;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .btn-manut {
      padding: 8px 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px; font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
      text-decoration: none;
      display: inline-block;
    }

    @media (min-width: 400px) {
      .btn-manut { font-size: 12px; padding: 9px 16px; }
    }

    .btn-manut:hover { opacity: 0.82; }

    .btn-manut.done {
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green-border);
    }

    /* EXPAND */
    .rel-body {
      display: none;
      padding: 0 14px 14px 18px;
      border-top: 1px solid var(--border);
    }

    @media (min-width: 480px) {
      .rel-body { padding: 0 16px 16px 20px; }
    }

    .rel-body.open { display: block; }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
      margin-top: 12px;
    }

    .detail-key { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
    .detail-val { font-size: 12px; margin-top: 2px; }

    .desc-box {
      margin-top: 12px; padding: 10px 12px;
      background: var(--bg); border-radius: 8px;
      font-size: 12px; color: var(--text); line-height: 1.5;
    }

    .manut-preview {
      margin-top: 10px; padding: 10px 12px;
      background: var(--green-bg);
      border: 1px solid var(--green-border);
      border-radius: 8px; font-size: 12px; color: var(--green);
    }

    .manut-preview strong { display: block; margin-bottom: 2px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-title { font-size: 16px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
    .empty-sub { font-size: 13px; }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="back-btn" href="home.html">← Voltar</a>
    <span class="topbar-title">Relatórios de Parada</span>
  </div>

  <div class="main">

    <div class="filter-row">
      <input class="search-input" id="search" type="text" placeholder="Buscar equipamento, operador..." oninput="renderList()"/>
      <button class="filter-btn active" onclick="setFiltro('todos', this)">Todos</button>
      <button class="filter-btn" onclick="setFiltro('aberto', this)">Em aberto</button>
      <button class="filter-btn" onclick="setFiltro('atendido', this)">Atendidos</button>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-val" id="s-total">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" style="color:var(--red)" id="s-aberto">0</div>
        <div class="stat-label">Em aberto</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" style="color:var(--green)" id="s-atendido">0</div>
        <div class="stat-label">Atendidos</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" style="color:var(--amber)" id="s-hoje">0</div>
        <div class="stat-label">Hoje</div>
      </div>
    </div>

    <div id="list-container"></div>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('ms_user') || 'null');
    if (!user) window.location.href = 'index.html';

    const codigos = {
      '1':'Quebra','2':'Set-up','3':'Troca fer.','4':'Produção',
      '5':'Pequenas paradas','6':'Velocidade','7':'Defeito',
      '8':'Programada','9':'Gestão','10':'Mov. operacionais',
      '11':'Organização','12':'Logística','13':'Medições e ajuste'
    };

    let filtro = 'todos';

    function setFiltro(f, btn) {
      filtro = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderList();
    }

    function getStatusBadge(r) {
      if (r.manutencao) return { cls: 'badge-green', label: 'Atendido' };
      return { cls: 'badge-red', label: 'Em aberto' };
    }

    function getCodBadge(cod) {
      if (['1','2'].includes(cod)) return 'badge-red';
      if (['3','7','5'].includes(cod)) return 'badge-amber';
      return 'badge-blue';
    }

    function formatDate(iso) {
      if (!iso) return '—';
      const [y, m, d] = iso.split('-');
      return `${d}/${m}/${y}`;
    }

    function renderList() {
      const rels = JSON.parse(localStorage.getItem('ms_relatorios') || '[]');
      const hoje = new Date().toISOString().slice(0, 10);
      const search = document.getElementById('search').value.toLowerCase();

      document.getElementById('s-total').textContent    = rels.length;
      document.getElementById('s-aberto').textContent   = rels.filter(r => !r.manutencao).length;
      document.getElementById('s-atendido').textContent = rels.filter(r => r.manutencao).length;
      document.getElementById('s-hoje').textContent     = rels.filter(r => r.dataISO === hoje).length;

      let lista = [...rels].reverse();
      if (filtro === 'aberto')   lista = lista.filter(r => !r.manutencao);
      if (filtro === 'atendido') lista = lista.filter(r => r.manutencao);
      if (search) {
        lista = lista.filter(r =>
          (r.equipamento || '').toLowerCase().includes(search) ||
          (r.operador || '').toLowerCase().includes(search) ||
          (r.linha || '').toLowerCase().includes(search)
        );
      }

      const container = document.getElementById('list-container');
      container.innerHTML = '';

      if (lista.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📋</div>
            <div class="empty-title">Nenhum relatório encontrado</div>
            <div class="empty-sub">Tente mudar o filtro ou registrar uma nova parada.</div>
          </div>`;
        return;
      }

      lista.forEach(r => {
        const status   = getStatusBadge(r);
        const codBadge = getCodBadge(r.codMotivo);
        const barColor = r.manutencao ? 'var(--green)' : (['1','2'].includes(r.codMotivo) ? 'var(--red)' : 'var(--amber)');
        const nomeMotivo = codigos[r.codMotivo] || `Cód. ${r.codMotivo}`;
        const btnLabel = r.manutencao ? 'Ver' : 'Manut.';
        const btnCls   = r.manutencao ? 'btn-manut done' : 'btn-manut';

        const card = document.createElement('div');
        card.className = 'rel-card';
        card.innerHTML = `
          <div class="rel-card-header">
            <div class="status-bar" style="background:${barColor}"></div>
            <div class="rel-header-content" onclick="toggleCard('body-${r.id}')">
              <div class="rel-main">
                <div class="rel-top">
                  <span class="rel-equip">${r.equipamento || '—'}</span>
                  <span class="badge ${status.cls}">${status.label}</span>
                  <span class="badge ${codBadge}">${r.codMotivo} — ${nomeMotivo}</span>
                </div>
                <div class="rel-meta">
                  Linha ${r.linha || '—'} · Op: ${r.operador || '—'} · ${formatDate(r.dataInicial)} ${r.inicioOcorrencia || ''}
                </div>
              </div>
            </div>
            <div class="btn-manut-wrap">
              <a class="${btnCls}" href="manutencao.html?id=${r.id}">${btnLabel}</a>
            </div>
          </div>
          <div class="rel-body" id="body-${r.id}">
            <div class="detail-grid">
              <div><div class="detail-key">Cód. Equip.</div><div class="detail-val">${r.codEquipamento || '—'}</div></div>
              <div><div class="detail-key">Lote</div><div class="detail-val">${r.lote || '—'}</div></div>
              <div><div class="detail-key">Data inicial</div><div class="detail-val">${formatDate(r.dataInicial)}</div></div>
              <div><div class="detail-key">Data final</div><div class="detail-val">${formatDate(r.dataFinal) || '—'}</div></div>
              <div><div class="detail-key">Início</div><div class="detail-val">${r.inicioOcorrencia || '—'}</div></div>
              <div><div class="detail-key">Fim</div><div class="detail-val">${r.fimOcorrencia || '—'}</div></div>
              <div><div class="detail-key">Duração</div><div class="detail-val">${r.duracao !== null && r.duracao !== undefined ? r.duracao + ' min' : '—'}</div></div>
              <div><div class="detail-key">Turno</div><div class="detail-val">${r.turno || '—'}</div></div>
            </div>
            <div class="desc-box">${r.descricao || '—'}</div>
            ${r.manutencao ? `
              <div class="manut-preview">
                <strong>Registrado por ${r.manutencao.manut1Nome || '—'}</strong>
                Tarefa: ${r.manutencao.tarefa || '—'} · Área: ${r.manutencao.area || '—'}
              </div>` : ''}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleCard(id) {
      const body = document.getElementById(id);
      if (body) body.classList.toggle('open');
    }

    renderList();
  </script>
</body>
</html>
